# The test suite is the gate for EqUpdater's safety rules (unmanaged addons
# and mods, DLL overwrite protection, version ordering, consent, backups,
# update planning). It runs here on every push and pull request, and before
# any release build (python build.py --release) -- not on an end user's PC
# during install.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pillow certifi

      - name: Run the test suite
        run: python tools/check.py --log test-log.txt

      - name: Keep the full log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-log.txt
