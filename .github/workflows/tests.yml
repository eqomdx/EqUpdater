# The test suite is the gate for EqUpdater's safety rules (unmanaged addons
# and mods, DLL overwrite protection, version ordering, consent, backups,
# update planning). It runs here on every push and pull request, on Windows
# and on Linux -- one codebase, both platforms -- and before any release
# build (python build.py --release) -- not on an end user's PC during
# install. Packaging the release artifacts is release.yml.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pillow certifi

      - name: Run the test suite
        run: python tools/check.py --log test-log.txt

      - name: Keep the full log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows
          path: test-log.txt

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The same Python as the AppImage is built with: deadsnakes' 3.12,
      # whose tkinter uses the system's Tk (with Xft, so fontconfig fonts).
      - name: Install Python 3.12 with Tk, and a virtual display
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv python3.12-tk \
            xvfb fonts-liberation
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip pillow certifi

      - name: Run the test suite
        run: xvfb-run -a .venv/bin/python tools/check.py --log test-log.txt

      - name: Keep the full log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-linux
          path: test-log.txt
