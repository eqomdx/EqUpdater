# Release artifacts, both from the same commit:
#
#   EqUpdater-vX.Y.Z-Windows.exe            (windows-latest)
#   EqUpdater-vX.Y.Z-Linux-x86_64.AppImage  (ubuntu-22.04: older glibc, so
#                                            newer distributions run it too)
#
# Publishing a GitHub release for tag vX.Y.Z builds them, tests them and
# attaches them to that release. The tag must match APP_VERSION in
# equpdater/branding.py -- there is one version, not one per platform.
# Pull requests build them too and keep them as workflow artifacts, so a
# packaging mistake is caught before a release.
#
# Every artifact runs its own --self-test before it is published: it must
# start without Python, carry its CA bundle with verification on, its
# fonts and artwork, aria2c on Linux, and make a real HTTPS request. On
# Linux it also opens the real window under Xvfb (--gui), which draws the
# background through Pillow's ImageTk bridge.
name: release

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pillow certifi

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, '.'); from equpdater import branding; print(branding.APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match APP_VERSION $VERSION"; exit 1
          fi

      - name: Tests
        run: python tools/check.py --log test-log.txt

      - name: Build the app and the installer
        run: python build.py --setup

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EqUpdater\EqUpdater.exe `
                 -ArgumentList "--self-test=$PWD\self-test.json","--network" -Wait -PassThru
          Get-Content self-test.json
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: EqUpdater-v${{ steps.version.outputs.version }}-Windows
          path: dist/EqUpdater-v${{ steps.version.outputs.version }}-Windows.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/EqUpdater-v${{ steps.version.outputs.version }}-Windows.exe" --clobber

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Python 3.12 with Tk, and a virtual display
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv python3.12-tk \
            python3.12-dev xvfb fonts-liberation file
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip pyinstaller pillow certifi

      - name: Version
        id: version
        run: |
          VERSION=$(.venv/bin/python -c "import sys; sys.path.insert(0, '.'); from equpdater import branding; print(branding.APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match APP_VERSION $VERSION"; exit 1
          fi

      - name: Tests
        run: xvfb-run -a .venv/bin/python tools/check.py --log test-log.txt

      - name: Build the AppImage
        run: .venv/bin/python tools/build_appimage.py

      - name: Self-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE="dist/EqUpdater-v${{ steps.version.outputs.version }}-Linux-x86_64.AppImage"
          file "$APPIMAGE"
          ls -la dist/
          # Run as a player would, from outside the source tree.
          cd "$RUNNER_TEMP"
          code=0
          # --gui opens and closes the real main window under Xvfb, so the
          # background goes through ImageTk.PhotoImage as on a player's
          # first launch (it caught the missing PIL._tkinter_finder).
          xvfb-run -a "$GITHUB_WORKSPACE/$APPIMAGE" --self-test="$RUNNER_TEMP/self-test.json" --network --gui || code=$?
          cat "$RUNNER_TEMP/self-test.json" || true
          exit $code

      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: EqUpdater-v${{ steps.version.outputs.version }}-Linux-x86_64
          path: dist/EqUpdater-v${{ steps.version.outputs.version }}-Linux-x86_64.AppImage

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/EqUpdater-v${{ steps.version.outputs.version }}-Linux-x86_64.AppImage" --clobber
